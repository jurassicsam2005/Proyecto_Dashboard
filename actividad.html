<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Dashboard de Tareas</title>
<body>
    <header class="header">
        <h1>Dashboard de Tareas</h1>
        <img src="C:\Users\bsamu\OneDrive\PROGRAMACION WEB\Proyecto pagina web\GODZILLA\godzilla.png" alt="GODZILLA">
</head>
    </header>
    <img src="C:\Users\bsamu\OneDrive\Programacion por computadora\Actividad\gojira.gif" alt="Gojira" width="150" height="150">


    <main class="container">

        <section class="task-form">
         <input id="taskInput" type="text" placeholder="Nueva tarea">
    
          <!-- Selector de categoría -->
          <select id="taskCategory">
             <option value="Escuela">Escuela</option>
             <option value="Trabajo">Trabajo</option>
             <option value="Personal">Personal</option>
            </select>

            <select id="taskPriority">
              <option value="Alta">Alta</option>
              <option value="Media">Media</option>
              <option value="Baja">Baja</option>
            </select>

          <button id="addTaskBtn">Agregar</button>
        </section>

        <button id="toggleDarkMode">🌙 Modo oscuro</button>

        <!-- Contador de tareas -->
        <section class="task-stats">
            <p>Total: <span id="totalTasks">0</span></p>
            <p>Completadas: <span id="completedTasks">0</span></p>
            <p>Pendientes: <span id="pendingTasks">0</span></p>
            <p>Progreso: <span id="progress">0%</span></p>
        </section>

        <!-- Botones de ordenamiento -->
        <section class="task-sort">
            <button id="sortAZ">Ordenar de A → Z</button>
            <button id="sortZA">Ordenar de Z → A</button>
        </section>

        <!-- Lista de tareas -->
        <section id="taskList" class="task-list">
            <!-- Aquí se renderizan las tareas -->
        </section>

        <!-- Botones de acciones masivas -->
        <section class="task-actions">
            <button id="deleteAll">Borrar todo</button>
            <button id="markAll">Marcar todas</button>
            <button id="unmarkAll">Desmarcar todas</button>
        </section>

    </main>

    <!-- Conexión con el archivo JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
