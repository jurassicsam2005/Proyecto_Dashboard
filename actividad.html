<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Dashboard de Tareas</title>
</head>
<body>
    <header class="header">
        <h1>Dashboard de Tareas</h1>
    </header>
    <main class="container">

        <section class="task-form">
            <input id="taskInput" type="text" placeholder="Nueva tarea">
            <button id="addTaskBtn">Agregar</button>
        </section>

        <!-- El Contador de tareas-->
         <section class="task-stats">
            <p>Total: <span id="totalTasks"> 0 </span></p>
            <p>Completadas: <span id="completedTasks"> 0 </span> </p>
            <p>Pendientes: <span id="pendingTasks"> 0 </span></p>
            <p>Progreso: <span id="progress">0%</span> </p>
         </section>

         <section class="task-sort">
            <button id="sortAZ">Ordenar de A -> Z</button>
            <button id="sortZA">Ordenar de Z -> A</button>
         </section>

        <section id="taskList" class="task-list">
            <!--<div class="task-item">
                <div class="task-left">
                    <input type="checkbox">
                    <span>Estudiar Javascript</span>
                </div>
                <button class="delete-btn">Eliminar</button>
            </div>-->
        </section>

    </main>
    <!-- NUEVO EN ESTA CLASE -->
    <!-- Conexión con el archivo JavaScript -->
    <script src="js/script.js"></script>

    <script>
      function toggleCompletadas() {
      let tareas = document.querySelectorAll(".tarea");
      let check = document.getElementById("checkCompletadas").checked;

     tareas.forEach(tarea => {
         if (check) {
         tarea.classList.add("completada");
        } else {
         tarea.classList.remove("completada");
        }
        });
    }
    </script>

    <button id="deleteAll">Borrar todo</button>
    <button id="markAll">Marcar todas</button>
    <button id="unmarkAll">Desmarcar todas</button>

</body>
</html>
